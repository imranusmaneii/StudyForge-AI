<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient: Deep Midnight Navy -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070D1D"/>
      <stop offset="100%" stop-color="#020610"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Dark Blue Mortarboard Top -->
    <linearGradient id="capTopGrad" x1="8" y1="14" x2="56" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="25%" stop-color="#1E3A8A"/>
      <stop offset="70%" stop-color="#0F204C"/>
      <stop offset="100%" stop-color="#0A1533"/>
    </linearGradient>

    <!-- Dark Blue Skullcap Band -->
    <linearGradient id="capBandGrad" x1="18" y1="28" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B1530"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Tab Tile Frame (Rounded Squircle for Windows/Mac browser tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Inner Ambient Glow Behind Cap -->
  <circle cx="32" cy="27" r="16" fill="#1E40AF" opacity="0.35" filter="url(#softShadow)"/>

  <!-- Skullcap (Lower Head Band) -->
  <path d="M19 28.5 V37 C19 44 45 44 45 37 V28.5 Z" 
        fill="url(#capBandGrad)" 
        stroke="#3B82F6" 
        stroke-width="1.6" 
        stroke-linejoin="round"/>

  <!-- Lower Skullcap Accent Arc -->
  <path d="M21 34 C26 37.5 38 37.5 43 34" 
        stroke="#60A5FA" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        fill="none" 
        opacity="0.8"/>

  <!-- Mortarboard Top (Dark Blue Diamond Cap) -->
  <g filter="url(#softShadow)">
    <polygon points="32,13 55,24.5 32,36 9,24.5" 
             fill="url(#capTopGrad)" 
             stroke="#60A5FA" 
             stroke-width="2" 
             stroke-linejoin="round"/>
    <!-- Highlight Reflection on Cap Edge -->
    <path d="M9 24.5 L32 36 L55 24.5" 
          stroke="#93C5FD" 
          stroke-width="1" 
          stroke-linecap="round" 
          opacity="0.8"/>
  </g>

  <!-- Center Button (Gold) -->
  <ellipse cx="32" cy="24.5" rx="2.8" ry="2" fill="#FBBF24" stroke="#B45309" stroke-width="0.7"/>

  <!-- Golden Tassel Cord -->
  <path d="M32 24.5 Q43 25.5 48.5 29 L48.5 41.5" 
        fill="none" 
        stroke="#FBBF24" 
        stroke-width="1.8" 
        stroke-linecap="round"/>

  <!-- Tassel Ring -->
  <circle cx="48.5" cy="41.5" r="1.3" fill="#D97706"/>

  <!-- Tassel Brush / Fringe -->
  <polygon points="46.5,42.5 50.5,42.5 51.5,50 45.5,50" fill="#F59E0B"/>
  <path d="M47 42.5 L46.5,50 M48.5 42.5 L48.5,50 M50 42.5 L50.5,50" stroke="#FEF08A" stroke-width="0.8"/>
</svg>
