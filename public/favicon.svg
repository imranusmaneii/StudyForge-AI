<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Blue Gradients -->
    <linearGradient id="capTop" x1="4" y1="7" x2="60" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="30%" stop-color="#1E3A8A"/>
      <stop offset="75%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="capUnder" x1="16" y1="30" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="32" y1="23.5" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Skullcap Band Beneath Mortarboard -->
  <path d="M17 31 V42.5 C17 49.5 47 49.5 47 42.5 V31 Z" 
        fill="url(#capUnder)" 
        stroke="#2563EB" 
        stroke-width="1.8" 
        stroke-linejoin="round"/>
  
  <!-- Subtle Ribbon Arc on Skullcap -->
  <path d="M19 38.5 C25 43 39 43 45 38.5" 
        stroke="#60A5FA" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        opacity="0.85"/>

  <!-- Mortarboard Diamond Top (Pure Dark Blue Cap) -->
  <polygon points="32,7 60,23.5 32,40 4,23.5" 
           fill="url(#capTop)" 
           stroke="#3B82F6" 
           stroke-width="2" 
           stroke-linejoin="round"/>

  <!-- Crisp Light Blue Lower Bevel Highlight for High Visibility on Dark & Light Tabs -->
  <path d="M4 23.5 L32 40 L60 23.5" 
        stroke="#93C5FD" 
        stroke-width="1.3" 
        stroke-linecap="round" 
        opacity="0.95"/>

  <!-- Center Button -->
  <ellipse cx="32" cy="23.5" rx="3.2" ry="2.3" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.2"/>

  <!-- Tassel Cord -->
  <path d="M32 23.5 Q45 25 51 29.5 L51 45" 
        fill="none" 
        stroke="url(#tasselGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round"/>

  <!-- Tassel Ring -->
  <circle cx="51" cy="45" r="1.6" fill="#60A5FA"/>

  <!-- Tassel Fringe Brush -->
  <polygon points="48,46.5 54,46.5 55.5,58 46.5,58" fill="#1D4ED8" stroke="#3B82F6" stroke-width="0.8"/>
  <line x1="49" y1="47" x2="48" y2="57.5" stroke="#93C5FD" stroke-width="0.8"/>
  <line x1="51" y1="47" x2="51" y2="57.5" stroke="#93C5FD" stroke-width="0.8"/>
  <line x1="53" y1="47" x2="54" y2="57.5" stroke="#93C5FD" stroke-width="0.8"/>
</svg>
